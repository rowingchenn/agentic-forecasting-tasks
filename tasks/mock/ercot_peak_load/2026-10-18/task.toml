# Offline replay of the ercot_peak_load run day 2026-10-18, generated from tasks/live/ercot_peak_load
# by the agentic-forecasting pipeline (af/mock.py). Edit the live Task instead.
schema_version = "1.4+ale.1"
artifacts = ["/home/user/output"]

[task]
name = "agentic-forecasting/ercot-peak-load-mock-2026-10-18"
keywords = ["forecasting", "mock", "energy"]

[environment]
cpus = 4
memory_mb = 8192

[agent]
user = "user"
timeout_sec = 5400
network_mode = "no-network"

[verifier]
timeout_sec = 120

[metadata.agentic-forecasting]
target = "ercot_peak_load"
mode = "mock"
run_date = "2026-10-18"
