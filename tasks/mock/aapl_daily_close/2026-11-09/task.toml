# Offline replay of the aapl_daily_close run day 2026-11-09, generated from tasks/live/aapl_daily_close
# by the agentic-forecasting pipeline (af/mock.py). Edit the live Task instead.
schema_version = "1.4+ale.1"
artifacts = ["/home/user/output"]

[task]
name = "agentic-forecasting/aapl-daily-close-mock-2026-11-09"
keywords = ["forecasting", "mock", "markets", "equities"]

[environment]
cpus = 8
memory_mb = 32768

[agent]
user = "user"
timeout_sec = 5400
network_mode = "no-network"

[verifier]
timeout_sec = 120

[metadata.agentic-forecasting]
target = "aapl_daily_close"
mode = "mock"
run_date = "2026-11-09"
