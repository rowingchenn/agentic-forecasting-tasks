# Offline replay of the conus_drought_area run day 2026-11-12, generated from tasks/live/conus_drought_area
# by the agentic-forecasting pipeline (af/mock.py). Edit the live Task instead.
schema_version = "1.4+ale.1"
artifacts = ["/home/user/output"]

[task]
name = "agentic-forecasting/conus-drought-area-mock-2026-11-12"
keywords = ["forecasting", "mock", "environment"]

[environment]
cpus = 8
memory_mb = 32768

[agent]
user = "user"
timeout_sec = 5400
network_mode = "no-network"

[verifier]
timeout_sec = 120

[metadata.agentic-forecasting]
target = "conus_drought_area"
mode = "mock"
run_date = "2026-11-12"
