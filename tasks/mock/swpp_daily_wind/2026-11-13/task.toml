# Offline replay of the swpp_daily_wind run day 2026-11-13, generated from tasks/live/swpp_daily_wind
# by the agentic-forecasting pipeline (af/mock.py). Edit the live Task instead.
schema_version = "1.4+ale.1"
artifacts = ["/home/user/output"]

[task]
name = "agentic-forecasting/swpp-daily-wind-mock-2026-11-13"
keywords = ["forecasting", "mock", "energy", "wind"]

[environment]
cpus = 8
memory_mb = 32768

[agent]
user = "user"
timeout_sec = 5400
network_mode = "no-network"

[verifier]
timeout_sec = 120

[metadata.agentic-forecasting]
target = "swpp_daily_wind"
mode = "mock"
run_date = "2026-11-13"
